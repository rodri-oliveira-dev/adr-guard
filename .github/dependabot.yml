version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "deps"
      include: "scope"

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    rebase-strategy: "auto"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    rebase-strategy: "auto"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    rebase-strategy: "auto"
    # Digest-only pins are required by the Sonar policy. Dependabot cannot
    # reliably retain the Alpine variant for these references (see #315, #334).
    # Refresh these two images separately using verified Alpine 3.24 digests;
    # keep container build, smoke tests and vulnerability scans mandatory.
    ignore:
      - dependency-name: "dotnet/sdk"
      - dependency-name: "dotnet/runtime"
