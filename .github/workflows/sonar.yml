name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-contract:
    name: Sonar automation unit tests (offline)
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Test Sonar automation
        run: node --test scripts/tests/sonar-quality-sync.test.cjs scripts/tests/sonar-quality-gate.test.cjs

  analysis:
    name: Sonar analysis and coverage
    if: >-
      ${{ vars.SONAR_CI_ENABLED == 'true' &&
          ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
           (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify opt-in configuration and secret
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SONAR_PROJECT_KEY}" || { echo "::error::Set repository variable SONAR_PROJECT_KEY"; exit 1; }
          test -n "${SONAR_ORGANIZATION}" || { echo "::error::Set repository variable SONAR_ORGANIZATION"; exit 1; }
          test -n "${SONAR_TOKEN}" || { echo "::error::Set secret SONAR_TOKEN"; exit 1; }

      - name: Restore pinned analysis tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore AdrGuard.slnx

      - name: Begin Sonar analysis
        id: begin
        shell: bash
        env:
          SONARQUBE_SCANNER_PARAMS: '{"sonar.token":${{ toJSON(secrets.SONAR_TOKEN) }}}'
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          dotnet sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /o:"${SONAR_ORGANIZATION}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.cs.vscoveragexml.reportsPaths="artifacts/coverage/sonar/coverage.xml" \
            /d:sonar.exclusions="tests/**,benchmarks/**,website/**,scripts/**,skills/**,**/bin/**,**/obj/**,**/*.g.cs,**/*.generated.cs" \
            /d:sonar.coverage.exclusions="tests/**,benchmarks/**,eng/**,website/**,scripts/**,skills/**,**/*.g.cs,**/*.generated.cs" \
            /d:sonar.qualitygate.wait="${IS_PR}" \
            /d:sonar.qualitygate.timeout=300

      - name: Build instrumented solution
        run: >-
          dotnet build AdrGuard.slnx --configuration Release --no-restore
          --no-incremental --disable-build-servers

      - name: Collect test coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/coverage/sonar | Out-Null
          dotnet tool run dotnet-coverage -- collect `
            --settings eng/sonar-coverage.settings.xml `
            --output artifacts/coverage/sonar/coverage.xml `
            --output-format xml `
            pwsh -NoLogo -NoProfile -File eng/run-sonar-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify report contains all production assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'artifacts/coverage/sonar/coverage.xml'
          if (-not (Test-Path -LiteralPath $path)) { throw 'Sonar coverage report missing.' }
          [xml] $report = Get-Content -Raw -LiteralPath $path
          $names = if ($report.results.modules.module) {
            @($report.results.modules.module | ForEach-Object { [string]$_.name })
          } else {
            @($report.CoverageSession.Modules.Module | ForEach-Object { [string]$_.ModuleName })
          }
          foreach ($expected in @('AdrGuard.Core', 'adr-guard', 'adr-guard-mcp')) {
            $found = @($names | Where-Object {
              [IO.Path]::GetFileNameWithoutExtension($_) -ieq $expected
            })
            if ($found.Count -eq 0) { throw "Coverage does not contain $expected. Observed: $($names -join ', ')" }
          }
          if (@($names | Where-Object { $_ -match '(Tests|Benchmarks)(\.dll)?$' }).Count -gt 0) {
            throw 'Coverage unexpectedly includes test or benchmark modules.'
          }

      - name: Complete Sonar analysis and PR Quality Gate
        id: sonar_end
        shell: bash
        env:
          SONARQUBE_SCANNER_PARAMS: '{"sonar.token":${{ toJSON(secrets.SONAR_TOKEN) }}}'
        run: |
          set -euo pipefail
          dotnet sonarscanner end

      - name: Update one Quality Gate comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_SCAN_RESULT: ${{ steps.sonar_end.outcome }}
        with:
          script: |
            const updateQualityGate = require('./scripts/sonar-quality-gate.cjs');
            await updateQualityGate({github, context, core});
