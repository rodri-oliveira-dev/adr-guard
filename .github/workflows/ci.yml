name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-package:
    name: Build, test, and package
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(dotnet msbuild src/AdrGuard/AdrGuard.csproj -nologo -getProperty:VersionPrefix | tr -d '\r' | tail -n 1)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "ADR_GUARD_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Restore
        run: dotnet restore AdrGuard.slnx

      - name: Build
        run: dotnet build AdrGuard.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AdrGuard.slnx --configuration Release --no-build

      - name: Deterministic ADR review regression matrix
        run: >-
          dotnet test tests/AdrGuard.Tests/AdrGuard.Tests.csproj
          --configuration Release
          --no-build
          --
          --filter-class AdrGuard.Tests.Review.AdrReviewRegressionFixtureTests

      - name: Pack .NET Tool
        run: dotnet pack src/AdrGuard/AdrGuard.csproj --configuration Release --no-build --output artifacts/package

      - name: Verify versioned package and MSBuild metadata
        run: |
          test -s "artifacts/package/RodriOliveira.AdrGuard.${ADR_GUARD_VERSION}.nupkg"
          package_file="artifacts/package/RodriOliveira.AdrGuard.${ADR_GUARD_VERSION}.nupkg"
          unzip -Z1 "${package_file}" | grep -Fxq 'icon-nuget.png'
          unzip -p "${package_file}" RodriOliveira.AdrGuard.nuspec | grep -Fq '<icon>icon-nuget.png</icon>'
          cmp images/icon-nuget.png <(unzip -p "${package_file}" icon-nuget.png)
          test -s CHANGELOG.md
          grep -Fq "## [${ADR_GUARD_VERSION}]" CHANGELOG.md
          unzip -Z1 "${package_file}" | grep -Fxq "CHANGELOG.md"
          cmp CHANGELOG.md <(unzip -p "${package_file}" CHANGELOG.md)
          nuspec="$(unzip -p "${package_file}" RodriOliveira.AdrGuard.nuspec)"
          grep -Fq '<releaseNotes>' <<< "${nuspec}"
          grep -Fq 'MADR 4.0 validation' <<< "${nuspec}"
          grep -Fq 'Git-aware incremental checks' <<< "${nuspec}"
          grep -Fq "releases/tag/v${ADR_GUARD_VERSION}" <<< "${nuspec}"
          test "$(dotnet msbuild src/AdrGuard/AdrGuard.csproj -nologo -getProperty:PackageVersion | tr -d '\r' | tail -n 1)" = "${ADR_GUARD_VERSION}"

      - name: Install packaged tool
        run: >
          dotnet tool install
          --tool-path ./.tools
          RodriOliveira.AdrGuard
          --version "${ADR_GUARD_VERSION}"
          --add-source ./artifacts/package
          --ignore-failed-sources

      - name: Verify bilingual ADR review documentation
        run: bash scripts/adr-review-docs-test.sh ./.tools/adr-guard

      - name: Installed .NET Tool template and compatibility regressions
        run: bash scripts/template-regression-test.sh

      - name: Dogfood ADR validation
        run: ./.tools/adr-guard check docs/adr

      - name: Verify generated ADR index
        run: |
          ./.tools/adr-guard index docs/adr
          git diff --exit-code -- docs/adr/README.md

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adr-guard-package
          path: artifacts/package/*.nupkg
          if-no-files-found: error

  dockerfile-lint:
    name: Lint Dockerfile
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          trusted-registries: mcr.microsoft.com

  container-smoke:
    name: Build, smoke test, and scan container
    needs: dockerfile-lint
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: docker build --pull --tag adr-guard:ci .

      - name: Smoke test container image
        run: bash scripts/docker-smoke-test.sh adr-guard:ci

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: adr-guard:ci
          scanners: vuln
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          timeout: 10m

  action-release-policy:
    name: GitHub Action release policy
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable and moving tag behavior
        run: bash scripts/publish-action-tags-test.sh

      - name: Verify release publication ordering
        run: bash scripts/release-workflow-policy-test.sh

      - name: Verify release SemVer and version baseline policy
        run: bash scripts/release-version-policy-test.sh

  public-distribution-audit:
    name: Public distribution audit
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify latest public NuGet, Action refs, GHCR, and Docker Hub artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/public-distribution-smoke-test.sh

  github-action-contract:
    name: GitHub Action contract
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ACTION_FIXTURE_ROOT: .tmp/adr-action-contract

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest published Action runtime version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ ! "${latest_tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Latest GitHub Release is not a stable SemVer tag: ${latest_tag:-<empty>}."
            exit 1
          fi
          echo "ADR_GUARD_ACTION_IMAGE_VERSION=${BASH_REMATCH[1]}" >> "${GITHUB_ENV}"
          echo "Using latest published runtime image version ${BASH_REMATCH[1]} for Action contract tests."

      - name: Verify anonymous GHCR pull and published image security
        run: bash scripts/github-action-security-test.sh "${ADR_GUARD_ACTION_IMAGE_VERSION}"

      - name: Prepare isolated consumer fixtures
        run: bash scripts/github-action-fixtures.sh "${ACTION_FIXTURE_ROOT}"

      - name: Consumer check succeeds on valid ADRs
        uses: ./
        with:
          path: .tmp/adr-action-contract/valid ADRs
          command: check
          version: ${{ env.ADR_GUARD_ACTION_IMAGE_VERSION }}

      - name: Consumer check supports custom paths with spaces
        uses: ./
        with:
          path: .tmp/adr-action-contract/custom path/adr records
          command: check
          version: ${{ env.ADR_GUARD_ACTION_IMAGE_VERSION }}

      - name: Consumer check fails on an invalid ADR
        id: invalid-adr
        continue-on-error: true
        uses: ./
        with:
          path: .tmp/adr-action-contract/invalid ADRs
          command: check
          version: ${{ env.ADR_GUARD_ACTION_IMAGE_VERSION }}

      - name: Consumer check fails on a missing path
        id: missing-path
        continue-on-error: true
        uses: ./
        with:
          path: .tmp/adr-action-contract/does not exist
          command: check
          version: ${{ env.ADR_GUARD_ACTION_IMAGE_VERSION }}

      - name: Consumer check fails on an invalid command
        id: invalid-command
        continue-on-error: true
        uses: ./
        with:
          path: .tmp/adr-action-contract/valid ADRs
          command: unsupported
          version: ${{ env.ADR_GUARD_ACTION_IMAGE_VERSION }}

      - name: Assert expected consumer failures
        env:
          INVALID_ADR_OUTCOME: ${{ steps.invalid-adr.outcome }}
          MISSING_PATH_OUTCOME: ${{ steps.missing-path.outcome }}
          INVALID_COMMAND_OUTCOME: ${{ steps.invalid-command.outcome }}
        run: |
          test "${INVALID_ADR_OUTCOME}" = failure
          test "${MISSING_PATH_OUTCOME}" = failure
          test "${INVALID_COMMAND_OUTCOME}" = failure

      - name: Snapshot fixture filesystem before index
        run: |
          find "${ACTION_FIXTURE_ROOT}" -type f -print0             | sort -z             | xargs -0 sha256sum > "${RUNNER_TEMP}/action-fixtures-before.sha256"

      - name: Consumer index writes the selected fixture
        uses: ./
        with:
          path: .tmp/adr-action-contract/index ADRs
          command: index
          version: ${{ env.ADR_GUARD_ACTION_IMAGE_VERSION }}

      - name: Assert index changes only the intended output
        run: |
          test -s "${ACTION_FIXTURE_ROOT}/index ADRs/README.md"

          find "${ACTION_FIXTURE_ROOT}" -type f             ! -path "${ACTION_FIXTURE_ROOT}/index ADRs/README.md"             -print0             | sort -z             | xargs -0 sha256sum > "${RUNNER_TEMP}/action-fixtures-after.sha256"

          cmp             "${RUNNER_TEMP}/action-fixtures-before.sha256"             "${RUNNER_TEMP}/action-fixtures-after.sha256"

          mapfile -d '' generated_indexes < <(
            find "${ACTION_FIXTURE_ROOT}" -type f -name README.md -print0
          )
          test "${#generated_indexes[@]}" -eq 1
          test "${generated_indexes[0]}" = "${ACTION_FIXTURE_ROOT}/index ADRs/README.md"

      # Exercise the actual published moving @v1 entrypoint (not just ./ with
      # the latest public runtime). check/index/review compatibility stays
      # stable; new remains intentionally outside the Action command contract.
      - name: Prepare isolated published @v1 consumer fixtures
        run: |
          mkdir -p "${ACTION_FIXTURE_ROOT}/published-v1 ADRs"
          cp -R "${ACTION_FIXTURE_ROOT}/valid ADRs/." "${ACTION_FIXTURE_ROOT}/published-v1 ADRs/"

      - name: Published @v1 consumer check remains compatible
        uses: rodri-oliveira-dev/adr-guard@v1
        with:
          path: .tmp/adr-action-contract/published-v1 ADRs
          command: check

      - name: Published @v1 consumer index remains compatible
        uses: rodri-oliveira-dev/adr-guard@v1
        with:
          path: .tmp/adr-action-contract/published-v1 ADRs
          command: index

      - name: Published @v1 consumer cannot invoke new
        id: published-v1-unsupported-new
        continue-on-error: true
        uses: rodri-oliveira-dev/adr-guard@v1
        with:
          path: .tmp/adr-action-contract/published-v1 ADRs
          command: new

      - name: Assert published @v1 consumer outputs and command restriction
        env:
          NEW_OUTCOME: ${{ steps.published-v1-unsupported-new.outcome }}
        run: |
          test -s "${ACTION_FIXTURE_ROOT}/published-v1 ADRs/README.md"
          test "${NEW_OUTCOME}" = failure
          test "$(find "${ACTION_FIXTURE_ROOT}/published-v1 ADRs" -maxdepth 1 -name '[0-9]*.md' | wc -l)" -eq 1

      - name: Prepare deterministic published @v1 review provider mock
        run: |
          fake_bin="${RUNNER_TEMP}/published-v1-review-bin"
          mkdir -p "${fake_bin}"
          cat >"${fake_bin}/docker" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          case "${1:-}" in
            info|pull)
              exit 0
              ;;
            run)
              printf '%s\n' "$@" >"${PUBLISHED_V1_DOCKER_CAPTURE:?}"
              cat <<'JSON'
          {
            "schemaVersion": "1.0",
            "target": {
              "sourceId": "target",
              "path": "0001-use-postgresql.md"
            },
            "inputScope": {
              "explicitContext": [],
              "existingAdrs": []
            },
            "outcome": "no-follow-up-findings",
            "findings": []
          }
          JSON
              exit 0
              ;;
            *)
              echo "Unexpected docker invocation: $*" >&2
              exit 99
              ;;
          esac
          EOF
          chmod +x "${fake_bin}/docker"
          echo "${fake_bin}" >> "${GITHUB_PATH}"

      - name: Published @v1 consumer review remains compatible
        uses: rodri-oliveira-dev/adr-guard@v1
        env:
          PUBLISHED_V1_DOCKER_CAPTURE: ${{ runner.temp }}/published-v1-review-docker-args.txt
        with:
          command: review
          review-target: .tmp/adr-action-contract/published-v1 ADRs/0001-use-postgresql.md
          provider: openai
          model: mock-model

      - name: Assert published @v1 review used the deterministic provider path
        env:
          PUBLISHED_V1_DOCKER_CAPTURE: ${{ runner.temp }}/published-v1-review-docker-args.txt
        run: |
          grep -Fxq "review" "${PUBLISHED_V1_DOCKER_CAPTURE}"
          grep -Fxq -- "--provider" "${PUBLISHED_V1_DOCKER_CAPTURE}"
          grep -Fxq "openai" "${PUBLISHED_V1_DOCKER_CAPTURE}"
          rm -f "${RUNNER_TEMP}/published-v1-review-bin/docker"

      - name: Smoke test review in the published @v1 runtime image
        shell: bash
        run: |
          set -euo pipefail

          mock_server="${RUNNER_TEMP}/published-v1-review-provider.py"
          mock_port_file="${RUNNER_TEMP}/published-v1-review-provider.port"
          review_output="${RUNNER_TEMP}/published-v1-review-output.json"

          cat >"${mock_server}" <<'PY'
          import http.server
          import json
          import os
          import socketserver

          dimensions = [
              "clarity-and-rationale",
              "considered-alternatives",
              "nonfunctional-requirements",
              "risks-and-consequences",
              "architectural-consistency",
              "security-and-compliance",
              "implementation-and-operational-feasibility",
              "measurable-verification-criteria",
          ]

          provider_review = {
              "findings": [
                  {
                      "dimension": dimension,
                      "classification": "observed-evidence",
                      "source": "0001-use-postgresql.md",
                      "excerpt": "Decision.",
                      "explanation": "The selected ADR contains evidence for this dimension.",
                      "guidance": "Human reviewer should verify this dimension.",
                  }
                  for dimension in dimensions
              ]
          }

          response = {
              "choices": [
                  {
                      "message": {
                          "content": json.dumps(provider_review),
                      }
                  }
              ]
          }

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != "/v1/chat/completions":
                      self.send_error(404)
                      return

                  length = int(self.headers.get("Content-Length", "0"))
                  self.rfile.read(length)
                  body = json.dumps(response).encode("utf-8")

                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  return

          with socketserver.TCPServer(("127.0.0.1", 0), Handler) as server:
              with open(os.environ["MOCK_PORT_FILE"], "w", encoding="utf-8") as port_file:
                  port_file.write(str(server.server_address[1]))
              server.serve_forever()
          PY

          rm -f "${mock_port_file}"
          MOCK_PORT_FILE="${mock_port_file}" python3 "${mock_server}" &
          mock_pid=$!
          trap 'kill "${mock_pid}" 2>/dev/null || true' EXIT

          for _ in {1..50}; do
            [[ -s "${mock_port_file}" ]] && break
            sleep 0.1
          done
          test -s "${mock_port_file}"
          mock_port="$(cat "${mock_port_file}")"

          major_version="${ADR_GUARD_ACTION_IMAGE_VERSION%%.*}"
          image="ghcr.io/rodri-oliveira-dev/adr-guard:${major_version}"
          docker pull "${image}" >/dev/null

          docker run --rm --read-only --network host \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --workdir /workspace \
            "${image}" \
            review "/workspace/${ACTION_FIXTURE_ROOT}/published-v1 ADRs/0001-use-postgresql.md" \
            --provider openai-compatible \
            --model mock-model \
            --endpoint "http://127.0.0.1:${mock_port}/v1" \
            --format json >"${review_output}"

          jq -e '.schemaVersion == "1.0"' "${review_output}" >/dev/null
          jq -e '.outcome == "no-follow-up-findings"' "${review_output}" >/dev/null
          jq -e '.dimensions | length == 8' "${review_output}" >/dev/null
          jq -e '.findings == []' "${review_output}" >/dev/null

      - name: Compare Action with the published CLI diagnostic matrix
        run: >-
          bash scripts/github-action-contract-test.sh
          "${ADR_GUARD_ACTION_IMAGE_VERSION}"
          "${ACTION_FIXTURE_ROOT}"

      - name: Verify low-level input, exit-code, mount, and workspace behavior
        run: bash scripts/github-action-smoke-test.sh "${ADR_GUARD_ACTION_IMAGE_VERSION}"

      - name: Verify opt-in AI review paths with mock provider
        run: bash scripts/github-action-review-test.sh

      - name: Verify annotations, summaries, and hostile diagnostic handling
        run: bash scripts/github-action-report-test.sh

      - name: Verify consumer documentation and workflow examples
        run: bash scripts/github-action-docs-test.sh

      - name: Verify GitHub Marketplace readiness
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: bash scripts/github-marketplace-readiness-test.sh
