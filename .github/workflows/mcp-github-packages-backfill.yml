name: MCP GitHub Packages Backfill

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Already published MCP SemVer to copy to GitHub Packages (without v)"
        type: string
        required: true

concurrency:
  group: mcp-release
  cancel-in-progress: false

jobs:
  validate-main-ci:
    name: Verify successful CI on selected main commit
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful completed CI push run for exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$VALIDATED_SHA&event=push&status=completed&per_page=100" | \
            jq -er --arg sha "$VALIDATED_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success") | .id][0]' 2>/dev/null)" || {
            echo "::error::Selected main commit $VALIDATED_SHA has no successful completed CI push run."
            exit 1
          }
          [[ -n "$run_id" ]] || {
            echo "::error::Selected main commit $VALIDATED_SHA has no successful completed CI push run."
            exit 1
          }
          echo "Selected main commit $VALIDATED_SHA passed CI in run $run_id."

  backfill-github-packages:
    name: Backfill verified MCP package
    needs: validate-main-ci
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: mcp-release
    permissions:
      contents: read
      packages: write
    env:
      MCP_PACKAGE_ID: RodriOliveira.AdrGuard.Mcp
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      GITHUB_PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify immutable Git tag and published MCP Release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::MCP version must be stable SemVer."; exit 1;
          }
          release_tag="mcp/v$VERSION"
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag")"
          validated_sha="$(jq -er '.object | select(.type == "commit") | .sha' <<< "$tag_json")"
          [[ "$validated_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::MCP release tag must identify an immutable commit."; exit 1;
          }
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
          jq -e --arg tag "$release_tag" --arg sha "$validated_sha" \
            '.tag_name == $tag and .target_commitish == $sha and .draft == false and .prerelease == false' \
            <<< "$release_json" > /dev/null || {
              echo "::error::MCP GitHub Release is missing or points to a different commit."; exit 1;
            }
          echo "VALIDATED_SHA=$validated_sha" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Download original published MCP release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mcp
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$MCP_PACKAGE_ID.$VERSION.nupkg" --dir artifacts/mcp
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir artifacts/mcp
      - name: Verify release checksum, package identity, and original commit
        run: bash scripts/verify-mcp-github-package.sh
      - name: Verify matching published package metadata on NuGet.org
        shell: bash
        run: |
          set -euo pipefail
          lower_id="$(echo "$MCP_PACKAGE_ID" | tr '[:upper:]' '[:lower:]')"
          nuget_url="https://api.nuget.org/v3-flatcontainer/$lower_id/$VERSION/$lower_id.$VERSION.nupkg"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 90 --retry 3 --max-filesize 25000000 \
            --output "$RUNNER_TEMP/mcp-public.nupkg" "$nuget_url"
          nuspec="$(unzip -p "$RUNNER_TEMP/mcp-public.nupkg" "$MCP_PACKAGE_ID.nuspec")"
          grep -Fq "<id>$MCP_PACKAGE_ID</id>" <<< "$nuspec"
          grep -Fq "<version>$VERSION</version>" <<< "$nuspec"
          grep -Fq "commit=\"$VALIDATED_SHA\"" <<< "$nuspec"
          # NuGet.org may repository-sign a package; therefore compare its
          # signed metadata to the immutable release, not raw nupkg bytes.
      - name: Publish or verify original MCP nupkg on GitHub Packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash scripts/publish-mcp-github-package.sh
      - name: Backfill summary
        shell: bash
        run: |
          echo "## MCP $VERSION on GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Original immutable release: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $VALIDATED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Packages: $MCP_PACKAGE_ID" >> "$GITHUB_STEP_SUMMARY"
