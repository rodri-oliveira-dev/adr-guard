name: VS Code VSIX Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-vsix-package
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package VSIX
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate extension identity and version
        id: extension
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./package.json');
          if (manifest.name !== 'adr-guard' || manifest.publisher !== 'rodrioliveira') {
            throw new Error('Unexpected VS Code extension ID');
          }
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(manifest.version)) {
            throw new Error('Extension version must be stable MAJOR.MINOR.PATCH');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          NODE

      - name: Audit
        run: npm audit --audit-level=low

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
          npm run test:readme-images -- --remote

      - name: Build and test
        run: |
          npm run build
          npm run test:unit
          npm run test:l10n
          xvfb-run -a npm run test:integration

      - name: Package and smoke test
        env:
          RELEASE_VERSION: ${{ steps.extension.outputs.version }}
        run: |
          npm run package:vsix
          test -f "adr-guard-${RELEASE_VERSION}.vsix"
          xvfb-run -a npm run test:vsix

      - name: Upload validated VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adr-guard-vscode-${{ steps.extension.outputs.version }}
          path: extensions/vscode/adr-guard-${{ steps.extension.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 21

      - name: Summarize downloadable package
        env:
          VSIX_VERSION: ${{ steps.extension.outputs.version }}
        run: |
          {
            echo '### Validated VS Code extension package'
            echo "- Package: \`adr-guard-${VSIX_VERSION}.vsix\`"
            echo "- Artifact: \`adr-guard-vscode-${VSIX_VERSION}\`"
            echo "- Download: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (Artifacts section)"
            echo '- Retention: 21 days'
            echo '- Marketplace publishing: disabled'
          } >> "${GITHUB_STEP_SUMMARY}"
