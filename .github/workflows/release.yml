name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-pack:
    name: Validate, build, test and pack
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.version.outputs.package_version }}
      release-tag: ${{ steps.version.outputs.release_tag }}
      validated-sha: ${{ steps.version.outputs.validated_sha }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve release version
        id: version
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          existing_tag="$(git tag --points-at "${VALIDATED_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

          if [[ -n "${existing_tag}" ]]; then
            package_version="${existing_tag#v}"
            release_tag="${existing_tag}"
          else
            base_version="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' src/AdrGuard/AdrGuard.csproj | head -n 1)"

            if [[ ! "${base_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::VersionPrefix must use stable SemVer format MAJOR.MINOR.PATCH."
              exit 1
            fi

            latest_tag="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

            if [[ -z "${latest_tag}" ]]; then
              package_version="${base_version}"
            else
              latest_version="${latest_tag#v}"
              highest="$(printf '%s\n%s\n' "${base_version}" "${latest_version}" | sort -V | tail -n 1)"

              if [[ "${highest}" == "${base_version}" && "${base_version}" != "${latest_version}" ]]; then
                package_version="${base_version}"
              else
                IFS='.' read -r major minor patch <<< "${latest_version}"
                package_version="${major}.${minor}.$((patch + 1))"
              fi
            fi

            release_tag="v${package_version}"
          fi

          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "validated_sha=${VALIDATED_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${package_version}"
          echo "Release tag: ${release_tag}"

      - name: Restore
        run: dotnet restore AdrGuard.slnx

      - name: Validate resolved MSBuild version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail

          resolved_version="$(dotnet msbuild src/AdrGuard/AdrGuard.csproj -nologo -getProperty:Version -p:Version="${PACKAGE_VERSION}" | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"
          resolved_package_version="$(dotnet msbuild src/AdrGuard/AdrGuard.csproj -nologo -getProperty:PackageVersion -p:Version="${PACKAGE_VERSION}" -p:PackageVersion="${PACKAGE_VERSION}" | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"

          if [[ "${resolved_version}" != "${PACKAGE_VERSION}" ]]; then
            echo "::error::Resolved Version '${resolved_version}' differs from release version '${PACKAGE_VERSION}'."
            exit 1
          fi

          if [[ "${resolved_package_version}" != "${PACKAGE_VERSION}" ]]; then
            echo "::error::Resolved PackageVersion '${resolved_package_version}' differs from release version '${PACKAGE_VERSION}'."
            exit 1
          fi

      - name: Build release
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: >-
          dotnet build AdrGuard.slnx
          --configuration Release
          --no-restore
          -p:Version="${PACKAGE_VERSION}"
          -p:PackageVersion="${PACKAGE_VERSION}"
          -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: dotnet test AdrGuard.slnx --configuration Release --no-build

      - name: Pack ADR Guard
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          VALIDATED_SHA: ${{ steps.version.outputs.validated_sha }}
        run: >-
          dotnet pack src/AdrGuard/AdrGuard.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:Version="${PACKAGE_VERSION}"
          -p:PackageVersion="${PACKAGE_VERSION}"
          -p:RepositoryCommit="${VALIDATED_SHA}"
          -p:ContinuousIntegrationBuild=true

      - name: Validate package output
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail

          expected="artifacts/packages/RodriOliveira.AdrGuard.${PACKAGE_VERSION}.nupkg"

          if [[ ! -f "${expected}" ]]; then
            echo "::error::Expected package '${expected}' was not produced."
            find artifacts/packages -maxdepth 1 -type f -print || true
            exit 1
          fi

          resolved_package_id="$(dotnet msbuild src/AdrGuard/AdrGuard.csproj -nologo -getProperty:PackageId | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"

          if [[ "${resolved_package_id}" != "RodriOliveira.AdrGuard" ]]; then
            echo "::error::Unexpected PackageId '${resolved_package_id}'."
            exit 1
          fi

      - name: Install and smoke-test packaged tool
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail

          dotnet tool install \
            --tool-path ./.release-tools \
            RodriOliveira.AdrGuard \
            --version "${PACKAGE_VERSION}" \
            --add-source ./artifacts/packages \
            --ignore-failed-sources

          ./.release-tools/adr-guard check docs/adr
          ./.release-tools/adr-guard index docs/adr
          git diff --exit-code -- docs/adr/README.md

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

  ensure-release-tag:
    name: Create release tag
    needs: build-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-and-pack.outputs.validated-sha }}
          fetch-depth: 0

      - name: Create or verify tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.release-tag }}
          VALIDATED_SHA: ${{ needs.build-and-pack.outputs.validated-sha }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"

            if [[ "${tag_sha}" != "${VALIDATED_SHA}" ]]; then
              echo "::error::Tag '${RELEASE_TAG}' points to ${tag_sha} instead of ${VALIDATED_SHA}."
              exit 1
            fi

            echo "Tag '${RELEASE_TAG}' already exists on the validated commit."
            exit 0
          fi

          git tag "${RELEASE_TAG}" "${VALIDATED_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

  publish-nuget:
    name: Publish to NuGet.org
    needs:
      - build-and-pack
      - ensure-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-package
          path: artifacts/packages

      - name: Exchange GitHub OIDC token for temporary NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: rodri-oliveira-dev

      - name: Publish ADR Guard to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.build-and-pack.outputs.package-version }}
        run: >-
          dotnet nuget push
          "artifacts/packages/RodriOliveira.AdrGuard.${PACKAGE_VERSION}.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${NUGET_API_KEY}"
          --skip-duplicate

  publish-github-packages:
    name: Publish to GitHub Packages
    needs:
      - build-and-pack
      - ensure-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-package
          path: artifacts/packages

      - name: Publish ADR Guard to GitHub Packages
        env:
          GITHUB_PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.build-and-pack.outputs.package-version }}
        run: >-
          dotnet nuget push
          "artifacts/packages/RodriOliveira.AdrGuard.${PACKAGE_VERSION}.nupkg"
          --source "${GITHUB_PACKAGE_SOURCE}"
          --api-key "${GITHUB_PACKAGE_TOKEN}"
          --skip-duplicate

  publish-container:
    name: Publish container images
    needs:
      - build-and-pack
      - ensure-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/adr-guard
      DOCKERHUB_IMAGE: docker.io/rodrigodotnet/adr-guard

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-and-pack.outputs.validated-sha }}
          persist-credentials: false

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN is required to publish to Docker Hub."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: rodrigodotnet
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build-and-pack.outputs.release-tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build-and-pack.outputs.release-tag }}
            type=semver,pattern={{major}},value=${{ needs.build-and-pack.outputs.release-tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ADR Guard
            org.opencontainers.image.description=A lightweight .NET CLI for validating, maintaining, indexing, and drafting Architecture Decision Records (ADRs).
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.authors=Rodrigo de Oliveira
            org.opencontainers.image.version=${{ needs.build-and-pack.outputs.package-version }}
            org.opencontainers.image.revision=${{ needs.build-and-pack.outputs.validated-sha }}
          annotations: |
            org.opencontainers.image.title=ADR Guard
            org.opencontainers.image.description=A lightweight .NET CLI for validating, maintaining, indexing, and drafting Architecture Decision Records (ADRs).
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.build-and-pack.outputs.package-version }}
            org.opencontainers.image.revision=${{ needs.build-and-pack.outputs.validated-sha }}

      - name: Build and push multi-platform image
        id: build-container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=adr-guard-release-container
          cache-to: type=gha,mode=max,scope=adr-guard-release-container

      - name: Verify published multi-platform manifests
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build-and-pack.outputs.package-version }}
        run: |
          set -euo pipefail

          for image in "${GHCR_IMAGE}" "${DOCKERHUB_IMAGE}"; do
            echo "Verifying ${image}:${PACKAGE_VERSION}"
            manifest="$(docker buildx imagetools inspect --raw "${image}:${PACKAGE_VERSION}")"

            jq -e '
              [.manifests[].platform | "\(.os)/\(.architecture)"] as $platforms
              | (($platforms | index("linux/amd64")) != null)
                and (($platforms | index("linux/arm64")) != null)
            ' <<< "${manifest}" >/dev/null
          done

      - name: Show published image digest
        env:
          IMAGE_DIGEST: ${{ steps.build-container.outputs.digest }}
        run: echo "Published container digest ${IMAGE_DIGEST}"

  github-release:
    name: Create GitHub Release
    needs:
      - build-and-pack
      - ensure-release-tag
      - publish-nuget
      - publish-github-packages
      - publish-container
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-package
          path: artifacts/packages

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.release-tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "GitHub Release '${RELEASE_TAG}' already exists; refreshing package artifact."

            gh release upload "${RELEASE_TAG}" \
              artifacts/packages/*.nupkg \
              --repo "${GH_REPO}" \
              --clobber

            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            artifacts/packages/*.nupkg \
            --repo "${GH_REPO}" \
            --verify-tag \
            --generate-notes \
            --title "${RELEASE_TAG}"
