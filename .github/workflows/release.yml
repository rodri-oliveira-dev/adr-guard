              | [.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] as $attestations
              | (($platforms | index("linux/amd64")) != null)
                and (($platforms | index("linux/arm64")) != null)
                and (($attestations | length) >= 2)
            ' <<< "${manifest}" >/dev/null
          done

      - name: Show published image digest
        env:
