name: Documentation portal

on:
  pull_request:
    branches:
      - main
      - docs/issue-149-documentation-experience
    paths:
      - "website/**"
      - "docs/**"
      - "extensions/vscode/README*.md"
      - "README.md"
      - "README.pt-BR.md"
      - ".github/workflows/documentation-portal.yml"
      - ".github/workflows/seo-validation.yml"
      - ".github/workflows/accessibility.yml"
      - ".github/workflows/lighthouse.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/**"
      - "extensions/vscode/README*.md"
      - "README.md"
      - "README.pt-BR.md"
      - ".github/workflows/documentation-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-portal-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    name: Validate portal
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install from lockfile
        working-directory: website
        run: npm ci

      - name: Check, test, build, and verify routes and links
        working-directory: website
        run: npm run validate

  build-pages:
    name: Build Pages artifact
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and upload Astro site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6
        with:
          path: website
          node-version: 24
          package-manager: npm@latest

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
