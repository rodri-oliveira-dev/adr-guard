name: Public distribution audit

# Publication integrity is intentionally independent from PR correctness.
# CI must not fail because a release was announced before artifacts were shipped.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

jobs:
  public-distribution-audit:
    name: Public distribution audit
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Verify latest public NuGet, Action refs, GHCR, and Docker Hub artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/public-distribution-smoke-test.sh
