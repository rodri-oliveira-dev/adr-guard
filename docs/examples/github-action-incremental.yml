name: Incremental ADR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  adr-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install an exact released ADR Guard version
        run: dotnet tool install --tool-path .tools RodriOliveira.AdrGuard --version 1.3.0
      - name: Validate changed ADRs against the checked-out base history
        run: .tools/adr-guard check docs/adr --changed --base-ref origin/main --baseline .adrguard-baseline.json
