name: ADR architecture drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Development-only source example. Replace <commit-sha> with a reviewed
      # commit that contains drift Action support until a coordinated release
      # publishes the same contract on an exact tag and the moving @v1 tag.
      - name: Verify ADR-backed architecture rules
        uses: rodri-oliveira-dev/adr-guard@<commit-sha>
        with:
          version: 1.9.0
          command: drift
          drift-rules: .adrguard-fitness.json
          drift-policy: enforce
          # drift-baseline: drift-baseline.json
          # drift-evidence: |
          #   evidence/unit-tests.json
          #   evidence/integration-tests.json
