name: ADR architecture drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Drift is available from the coordinated Action/CLI v1.10.0 release.
      # Pin the exact Action tag to keep source and container versions aligned.
      - name: Verify ADR-backed architecture rules
        uses: rodri-oliveira-dev/adr-guard@v1.10.0
        with:
          command: drift
          drift-rules: .adrguard-fitness.json
          drift-policy: enforce
          # drift-baseline: drift-baseline.json
          # drift-evidence: |
          #   evidence/unit-tests.json
          #   evidence/integration-tests.json
